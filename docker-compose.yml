services:

  auth-service:
    image: diyak644/auth-service:v1
    container_name: auth-service
    ports:
      - "8081:8080"
    restart: always

  quantity-service:
    image: diyak644/quantity-service:v1
    container_name: quantity-service
    ports:
      - "8082:8080"
    restart: always

  quantity-frontend:
    image: diyak644/quantity-frontend:v2
    container_name: quantity-frontend
    ports:
      - "5173:80"
    restart: always
